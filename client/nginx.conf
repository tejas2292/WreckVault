# Serves the built SPA and proxies /api/ to the API container.

# Keep the scheme a tunnel in front of us reported; otherwise use our own.
map $http_x_forwarded_proto $wv_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # Applies to every response below: no location in this file uses add_header,
    # so these are always inherited.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker's embedded DNS; resolving per request lets nginx start even while the
    # API container is down or being rebuilt.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $wv_api http://backend-api:5000;

    location /api/ {
        proxy_pass $wv_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wv_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Hashed build output: cache for a long time.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
