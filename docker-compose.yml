services:
  backend-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: password-manager-api
    restart: always
    ports:
      - "3012:5000"
    # DATABASE_URL (and optionally ALLOW_REGISTRATION) come from server/.env on the host;
    # the image itself carries no .env.
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wreckcloud
      - postgresql_default
    # No `command:` override and no source volumes: the image's CMD runs the plain node
    # process (a crash exits so `restart: always` fires; nodemon used to park instead),
    # and an anonymous node_modules volume would hide new dependencies.

  frontend-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: password-manager-client
    restart: always
    ports:
      - "3011:80"
    depends_on:
      - backend-api
    networks:
      - wreckcloud

networks:
  wreckcloud:
    driver: bridge
  # Created by the CasaOS-managed postgresql stack. Joining it lets the API
  # reach Postgres by container DNS name instead of the host's LAN IP, which
  # is not routable from the bridge during early boot (ENETUNREACH).
  postgresql_default:
    external: true

x-casaos:
  main: frontend-client
  title:
    en_us: WreckVault
  description:
    en_us: Self-hosted password manager (client + API).
  icon: https://raw.githubusercontent.com/tejas2292/hosted-images/refs/heads/main/wreck-vault.png
  port_map: "3011"
  scheme: http
  index: /
