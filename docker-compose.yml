version: '3.8'

services:
  backend-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: password-manager-api
    restart: always
    ports:
      - "3012:5000"
    environment:
      - PORT=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - wreckcloud
      - postgresql_default
    # No `command:` override — the Dockerfile's CMD (`npm start`) runs the
    # plain node process. Under `npm run dev`, nodemon caught a fatal DB-connect
    # crash and parked ("waiting for file changes"), keeping the container
    # alive so `restart: always` never fired. Cost a 3-day silent outage
    # after the 2026-08-28 reboot.

  frontend-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: password-manager-client
    restart: always
    ports:
      - "3011:3000" # Vite default
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend-api:5000
    networks:
      - wreckcloud
    # We want development mode with Hot Reloading
    command: npm run dev -- --host

networks:
  wreckcloud:
    driver: bridge
  # Created by the CasaOS-managed postgresql stack. Joining it lets the API
  # reach Postgres by container DNS name instead of the host's LAN IP, which
  # is not routable from the bridge during early boot (ENETUNREACH).
  postgresql_default:
    external: true
