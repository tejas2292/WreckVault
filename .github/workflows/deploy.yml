# Deploy WreckVault to server on push to main (after checks pass)
name: CI and Deploy

on:
  push:
    branches: [main]

jobs:
  check:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client deps
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Install server deps
        run: npm ci --prefix server

  deploy:
    name: Deploy to server
    runs-on: self-hosted
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -e
          cd ~/WreckVault
          git fetch origin
          git reset --hard origin/main
          docker compose pull --quiet 2>/dev/null || true
          docker compose up -d --build

      - name: Notify deployment
        if: success()
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          curl -s -X POST "$DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: DiscordBot (https://hermes-agent.local, 1.0)" \
            -d "{\"content\": \"🚀 **[${{ github.event.repository.name }}]** Deployed to production - $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')\"}"

      - name: Notify deployment failure
        if: failure()
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          curl -s -X POST "$DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: DiscordBot (https://hermes-agent.local, 1.0)" \
            -d "{\"content\": \"❌ **[${{ github.event.repository.name }}]** Deployment FAILED - $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')\"}"
