# Deploy WreckVault to server on push to main (after checks pass)
name: CI and Deploy

on:
  push:
    branches: [main]

jobs:
  client:
    name: Client lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: npm ci --prefix client

      - name: Lint client
        run: npm run lint --prefix client

      - name: Unit tests
        run: npm run test --if-present --prefix client

      - name: Build client
        run: npm run build --prefix client

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wreckvault
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: wreckvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wreckvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: npm ci --prefix server

      - name: Run server tests
        env:
          DATABASE_URL: postgres://wreckvault:ci-only@localhost:5432/wreckvault
        run: npm test --prefix server

  deploy:
    name: Deploy to server
    runs-on: self-hosted
    needs: [client, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -e
          cd ~/WreckVault
          git fetch origin
          git reset --hard origin/main
          docker compose -p wreckvault pull --quiet 2>/dev/null || true
          docker compose -p wreckvault up -d --build

      - name: Notify deployment
        if: success()
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          curl -s -X POST "$DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: DiscordBot (https://hermes-agent.local, 1.0)" \
            -d "{\"content\": \"🚀 **[${{ github.event.repository.name }}]** Deployed to production - $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')\"}"

      - name: Notify deployment failure
        if: failure()
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
        run: |
          curl -s -X POST "$DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -H "User-Agent: DiscordBot (https://hermes-agent.local, 1.0)" \
            -d "{\"content\": \"❌ **[${{ github.event.repository.name }}]** Deployment FAILED - $(TZ=Asia/Kolkata date '+%d %b %H:%M IST')\"}"
